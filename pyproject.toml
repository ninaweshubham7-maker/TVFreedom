[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-freedom"
version = "0.4.0.dev0"
description = "A Windows application to safely diagnose and customise compatible Android TV and Google TV devices."
readme = "README.md"
license = {text = "For educational and personal use only."}
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
packaging = [
    "pyinstaller>=6.22,<7",
]

[project.urls]
Homepage = "https://github.com/ninaweshubham7-maker/TVFreedom"
Issues = "https://github.com/ninaweshubham7-maker/TVFreedom/issues"

[project.scripts]
tv-freedom = "app:main"

[tool.setuptools]
# Include bundled platform-tools in the package
packages = [""]
package-dir = {"" = "."}

[tool.setuptools.package-data]
# Include bundled ADB binaries in platform-tools/
"*" = [
    "platform-tools/*",
    "platform-tools/**/*",
]

[tool.setuptools.exclude-package-data]
# Exclude test files and development artifacts from distribution
"*" = [
    "test_*.py",
    "__pycache__/*",
    ".pytest_cache/*",
    ".git/*",
    ".gitignore",
    ".venv/*",
    "*.md",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["."]
omit = [
    "test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false